name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgres client (for tests/e2e.sh's psql calls)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run e2e tests
        run: ./tests/e2e.sh
